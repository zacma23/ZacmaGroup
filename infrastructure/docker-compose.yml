version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: zacma-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: zacma-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  n8n:
    image: n8nio/n8n:latest
    container_name: zacma-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
    volumes:
      - n8n_data:/home/node/.n8n

  omniroute:
    image: node:20-alpine
    container_name: zacma-omniroute
    working_dir: /app
    command: sh -c "npx omniroute@latest"
    ports:
      - "20128:20128"
    volumes:
      - omniroute_data:/app/data

  prometheus:
    image: prom/prometheus:latest
    container_name: zacma-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: zacma-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  redis_data:
  qdrant_data:
  n8n_data:
  omniroute_data:
  grafana_data:
