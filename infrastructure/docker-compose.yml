version: "3.9"

networks:
  zacma-network:
    name: zacma-network
    driver: bridge

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: zacma-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENVIRONMENT=production
      - DEMO_MODE=true
      - PORT=8000
      - REDIS_URL=redis://zacma-redis:6379
      - QDRANT_HOST=zacma-qdrant
      - QDRANT_PORT=6333
      - OMNIROUTE_URL=http://zacma-omniroute:20128/v1
      - SUPABASE_URL=https://ihuxlbfqevubzsqebszp.supabase.co
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
    depends_on:
      - redis
      - qdrant
    networks:
      - zacma-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_SUPABASE_URL=https://ihuxlbfqevubzsqebszp.supabase.co
    container_name: zacma-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SUPABASE_URL=https://ihuxlbfqevubzsqebszp.supabase.co
    depends_on:
      - backend
    networks:
      - zacma-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: zacma-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zacma-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: zacma-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - zacma-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3

  n8n:
    image: n8nio/n8n:latest
    container_name: zacma-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - zacma-network

  omniroute:
    image: node:20-alpine
    container_name: zacma-omniroute
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npx --yes omniroute@latest"
    ports:
      - "20128:20128"
    volumes:
      - omniroute_data:/app/data
    networks:
      - zacma-network

  prometheus:
    image: prom/prometheus:latest
    container_name: zacma-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - zacma-network

  grafana:
    image: grafana/grafana:latest
    container_name: zacma-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - zacma-network

volumes:
  redis_data:
  qdrant_data:
  n8n_data:
  omniroute_data:
  grafana_data:
