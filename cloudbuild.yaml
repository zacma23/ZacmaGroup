# Google Cloud Build Pipeline for ZACMA Group Platform
# Builds, tests, and deploys Backend (FastAPI) and Frontend (Next.js) to Google Cloud Run

steps:
  # Step 1: Run Backend Tests
  - name: 'python:3.11-slim'
    id: 'test-backend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pytest -q

  # Step 2: Build & Push Backend Container to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/zacma-backend:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/zacma-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/zacma-backend'

  # Step 3: Deploy Backend API to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_BACKEND_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/zacma-backend:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8000'
      - '--cpu=1'
      - '--memory=1Gi'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=APP_ENVIRONMENT=production,DEMO_MODE=false,SUPABASE_URL=${_SUPABASE_URL},SANTIMPAY_MERCHANT_ID=${_SANTIMPAY_MERCHANT_ID},SANTIMPAY_BASE_URL=https://services.santimpay.com/api/v1/gateway,SANTIMPAY_TESTBED=false'

  # Step 4: Build & Push Frontend Container with Dynamic Backend URL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'build-frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_URL=$$(gcloud run services describe ${_BACKEND_SERVICE} --region=${_REGION} --format='value(status.url)' 2>/dev/null || echo "${_BACKEND_URL}")
        echo "Wiring Frontend to Live Backend URL: $$BACKEND_URL"
        docker build \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/zacma-frontend:${SHORT_SHA} \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/zacma-frontend:latest \
          --build-arg NEXT_PUBLIC_API_URL=$$BACKEND_URL \
          --build-arg NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL} \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY} \
          -f dashboard/Dockerfile dashboard
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/zacma-frontend --all-tags

  # Step 5: Deploy Frontend UI to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_FRONTEND_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/zacma-frontend:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--cpu=1'
      - '--memory=1Gi'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=NODE_ENV=production,NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL},NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}'

  # Step 6: Print Live Verified URLs
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'verify-urls'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "=========================================================="
        echo "🎉 LIVE GOOGLE CLOUD RUN SERVICES:"
        echo "Frontend URL: $$(gcloud run services describe ${_FRONTEND_SERVICE} --region=${_REGION} --format='value(status.url)')"
        echo "Backend API:  $$(gcloud run services describe ${_BACKEND_SERVICE} --region=${_REGION} --format='value(status.url)')"
        echo "=========================================================="

substitutions:
  _REGION: 'us-central1'
  _REPO_NAME: 'zacma-repo'
  _BACKEND_SERVICE: 'zacma-backend'
  _FRONTEND_SERVICE: 'zacma-frontend'
  _BACKEND_URL: 'https://zacma-backend-762777304269.us-central1.run.app'
  _SUPABASE_URL: 'https://ihuxlbfqevubzsqebszp.supabase.co'
  _SUPABASE_ANON_KEY: ''
  _SANTIMPAY_MERCHANT_ID: ''

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/zacma-backend:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/zacma-frontend:${SHORT_SHA}'

options:
  logging: CLOUD_LOGGING_ONLY
